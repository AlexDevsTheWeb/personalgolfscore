name: ci

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
